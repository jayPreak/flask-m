<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Re:Zero Meters Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #6c5ce7;
            --secondary-color: #a29bfe;
            --accent-color: #fd79a8;
            --bg-color: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.07);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --border-radius: 16px;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(108, 92, 231, 0.15) 0%, transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(253, 121, 168, 0.15) 0%, transparent 25%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 40px 24px;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        .header {
            margin-bottom: 40px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.8rem;
            font-weight: 700;
            margin-bottom: 12px;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .glass-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
        }
        
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: var(--border-radius);
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
            border-radius: var(--border-radius) var(--border-radius) 0 0;
        }
        
        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }
        
        .meter-name {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text-primary);
        }
        
        .meter-id {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }
        
        .meter-btn {
            display: inline-block;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
            color: white;
            padding: 10px 22px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(253, 121, 168, 0.3);
        }
        
        .meter-btn:hover {
            box-shadow: 0 8px 20px rgba(253, 121, 168, 0.5);
            transform: translateY(-2px);
        }
        
        .meter-icon {
            margin-bottom: 15px;
            height: 60px;
            width: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 16px;
        }
        
        .footer {
            margin-top: 60px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        
        .pulse {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent-color);
            margin-right: 8px;
            position: relative;
        }
        
        .pulse::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: var(--accent-color);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            100% {
                transform: scale(3);
                opacity: 0;
            }
        }
        
        /* For dark mode preference */
        @media (prefers-color-scheme: light) {
            :root {
                --bg-color: #f8fafc;
                --card-bg: rgba(255, 255, 255, 0.7);
                --text-primary: #1e293b;
                --text-secondary: #475569;
            }
            
            body {
                background-image: 
                    radial-gradient(circle at 15% 50%, rgba(108, 92, 231, 0.07) 0%, transparent 25%),
                    radial-gradient(circle at 85% 30%, rgba(253, 121, 168, 0.07) 0%, transparent 25%);
            }
            
            .glass-card {
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
                border: 1px solid rgba(0, 0, 0, 0.05);
            }
        }
        
        /* Responsive adjustments */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2.2rem;
            }
            
            .glass-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Re:Zero Meters Dashboard</h1>
            <p>Monitor and analyze real-time data from the various meters deployed throughout the kingdom. Access detailed metrics with a single click.</p>
        </div>
        
        <div class="glass-grid">
            {% for meter in meters %}
            <div class="glass-card">
                <div class="meter-icon">
                    <span class="pulse"></span>
                </div>
                <h2 class="meter-name">{{ meter.label }}</h2>
                <p class="meter-id">Meter ID: {{ meter.id }}</p>
                <a href="/meters/{{ meter.id }}" class="meter-btn">View Data</a>
            </div>
            {% endfor %}
        </div>
        
        <div class="footer">
            <p>© 2025 Jay Preak | Made with ❤️</p>
        </div>
    </div>
</body>
</html>
